namespace: SprykerTest\Glue\SecurityExtension
paths:
    tests: .
    data: ../../../_data
    support: _support
    output: ../../../_output
coverage:
    enabled: true
    remote: false
    whitelist: { include: ['../../../../src/*'] }
suites:
    Dependency:
        path: Dependency
        actor: SecurityExtensionDependencyTester
        modules:
            enabled:
                - Asserts
